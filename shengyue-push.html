<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>声乐数据—进度监控推送</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
display:flex;align-items:center;justify-content:center;min-height:100vh;background:#16171a;color:#e6e6e6;padding:20px}
.box{width:100%;max-width:380px;background:#1e2024;border:1px solid #2c2f36;border-radius:14px;padding:32px 28px}
h1{font-size:17px;font-weight:500;margin-bottom:6px;letter-spacing:.3px}
.sub{font-size:13px;color:#8b8f98;line-height:1.6;margin-bottom:22px}
input[type=password]{width:100%;padding:12px 14px;font-size:14px;background:#141519;
border:1px solid #33373f;border-radius:8px;color:#e6e6e6;outline:none;transition:border-color .15s}
input[type=password]:focus{border-color:#4f8cf7}
input[type=password]::placeholder{color:#5a5e66}
.err{display:none;font-size:12.5px;color:#f8776b;margin-top:10px;line-height:1.5}
.rem{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#8b8f98;margin:16px 0 18px;cursor:pointer;user-select:none}
.rem input{accent-color:#4f8cf7;cursor:pointer}
button{width:100%;padding:12px;font-size:14px;font-weight:500;color:#fff;background:#4f8cf7;
border:none;border-radius:8px;cursor:pointer;transition:background .15s}
button:hover:not(:disabled){background:#3d7ce6}
button:disabled{background:#33373f;color:#8b8f98;cursor:default}
.note{margin-top:18px;font-size:11.5px;color:#5a5e66;line-height:1.6;text-align:center}
</style>
<style id="cc-lv-style">
/*LOADER_CSS_START*/
/* 加载遮罩样式：内联在文档头部，随首个字节到达即可生效。
   注意：本段必须保持 id="cc-lv-style"，解锁后清理看板外壳样式时会跳过它。 */
#cc-loader{position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;
align-items:center;justify-content:center;gap:22px;background:#16171a;opacity:0;
transition:opacity .35s ease;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
-webkit-font-smoothing:antialiased}
#cc-loader.show{opacity:1}
#cc-loader.hide{opacity:0;pointer-events:none}
#cc-lv-ring{width:52px;height:52px;border-radius:50%;border:3px solid rgba(79,140,247,.18);
border-top-color:#4f8cf7;animation:ccspin .9s linear infinite}
@keyframes ccspin{to{transform:rotate(360deg)}}
#cc-lv-title{font-size:15.5px;font-weight:500;color:#e6e6e6;letter-spacing:.4px;text-align:center}
#cc-lv-bar-wrap{width:min(72vw,300px);height:4px;border-radius:99px;background:#2c2f36;overflow:hidden}
#cc-lv-bar{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#4f8cf7,#7aa8ff);
transition:width .3s ease}
#cc-lv-bar.indet{width:38%;animation:ccind 1.15s ease-in-out infinite}
@keyframes ccind{0%{margin-left:-38%}100%{margin-left:100%}}
#cc-lv-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:#8b8f98}
#cc-lv-sub{margin-top:-8px;font-size:12.5px;color:#8b8f98;line-height:1.75;text-align:center;
max-width:min(84vw,340px)}
#cc-lv-wait{display:none;font-size:11.5px;color:#6b707a}
#cc-lv-err{display:none;flex-direction:column;align-items:center;gap:14px}
#cc-lv-err .t{font-size:14px;color:#f8776b}
#cc-lv-err .m{font-size:12.5px;color:#8b8f98;line-height:1.7;text-align:center;max-width:min(84vw,320px)}
#cc-lv-retry{padding:9px 22px;font-size:13px;color:#fff;background:#4f8cf7;border:none;
border-radius:8px;cursor:pointer;transition:background .15s}
#cc-lv-retry:hover{background:#3d7ce6}
/*LOADER_CSS_END*/
</style>
</head>
<body>
<!--LOADER_BODY_START-->
<!-- 加载遮罩：必须是 body 第一个元素，流式下载时最先渲染，杜绝白屏/假死观感 -->
<div id="cc-loader">
  <div id="cc-lv-ring"></div>
  <div id="cc-lv-title">数据加载中…</div>
  <div id="cc-lv-bar-wrap"><div id="cc-lv-bar"></div></div>
  <div id="cc-lv-meta"><span id="cc-lv-pct">0%</span><span id="cc-lv-size"></span></div>
  <div id="cc-lv-sub"></div>
  <div id="cc-lv-wait"></div>
  <div id="cc-lv-err">
    <div class="t" id="cc-lv-errt"></div>
    <div class="m" id="cc-lv-errm"></div>
    <button id="cc-lv-retry" type="button">刷新重试</button>
  </div>
</div>
<!--LOADER_BODY_END-->
<div class="box" id="box">
  <h1>声乐数据—进度监控推送</h1>
  <p class="sub">请输入访问口令</p>
  <input type="password" id="pwd" placeholder="请输入访问口令" autocomplete="off" spellcheck="false" disabled>
  <div id="err" class="err"></div>
  <label class="rem"><input type="checkbox" id="rem"> 在这台电脑上记住 30 天</label>
  <button id="btn" disabled>页面加载中…</button>
  <p class="note">页面内容已加密存储，需口令解密后查看</p>
</div>
<script>
/* ===== 加载遮罩控制（小，紧随遮罩 DOM，尽早就绪）=====
   ★ 2026-09-04 加载反馈修复：加密看板是「外壳 + 尾部 MB 级 PAYLOAD」的单文件结构，
     首次访问必须等整个密文下载解析完，密码框按钮才可点击。此前这段时间页面只有
     一个静态输入框、零反馈，用户体感就是「卡死」。现在由本遮罩接管：
     环形 spinner + 进度条 + 真实大小提示 + 慢速安抚 + 超时出路，全流程可见。 */
/*LOADER_JS_START*/
var LV_TOTAL=360794, LV_T0=Date.now(), LV_SHOWN=false, LV_DONE=false, LV_P=0,
    LV_SLOW=false, LV_HINT=false, LV_TIMER=null, LV_FAIL=false;
function L(id){return document.getElementById(id)}
function LMB(b){return (b/1048576).toFixed(1)+" MB"}
function LShow(){
  if(LV_SHOWN||LV_FAIL)return; LV_SHOWN=true;
  var v=L("cc-loader"); if(v)v.classList.add("show");
  if(LV_TIMER===null)LV_TIMER=setInterval(LTick,250);
}
function LSetP(p){
  if(LV_DONE)return;
  if(p<LV_P)p=LV_P; LV_P=p;
  var bar=L("cc-lv-bar"),pct=L("cc-lv-pct");
  if(bar)bar.style.width=p.toFixed(1)+"%";
  if(pct)pct.textContent=Math.floor(p)+"%";
}
/* 真实网络进度：navigation transferSize 在部分浏览器加载期间可用，可用就用 */
function LReal(){
  try{
    var n=performance.getEntriesByType("navigation")[0];
    if(n&&n.transferSize>0&&LV_TOTAL>0)return Math.min(96,n.transferSize/LV_TOTAL*100);
  }catch(e){}
  return -1;
}
/* 兜底进度：按 ~220KB/s 保守估算耗时，指数逼近 92%，保证「不会提前走满」 */
function LEst(){
  var tau=Math.max(2500, LV_TOTAL/1024/220*1000), t=Date.now()-LV_T0;
  return Math.min(92, 92*(1-Math.exp(-t/tau)));
}
function LTick(){
  if(LV_DONE||LV_FAIL)return;
  // ★ 进度取「时间曲线」与「真实网络进度」的较大者。
  //   原因：Chromium 加载早期 navigation.transferSize 会返回一个 ~数百字节的非零
  //   小值且冻结不变，若直接采信会把进度锁死在 0%。故仅在 transferSize 增长到
  //   明显超过估算值时，才让真实进度接管。
  var rp=LReal(), est=LEst();
  LSetP(Math.max(est, rp>=0?rp:0));
  var t=(Date.now()-LV_T0)/1000;
  if(t>15&&!LV_SLOW){
    LV_SLOW=true;
    var s=L("cc-lv-sub");
    if(s)s.innerHTML="数据量较大（"+LMB(LV_TOTAL)+"），首次访问需完整下载<br>之后浏览器会自动缓存，再打开就快了";
  }
  if(LV_SLOW){var w=L("cc-lv-wait");if(w){w.style.display="block";w.textContent="已等待 "+Math.floor(t)+" 秒"}}
  if(t>90&&!LV_HINT){
    LV_HINT=true;
    var s2=L("cc-lv-sub");
    if(s2)s2.innerHTML="仍在加载中，请保持页面打开<br>若长时间无进展，可刷新重试";
  }
}
function LReady(){
  if(LV_DONE||LV_FAIL)return;
  LV_DONE=true;
  if(LV_TIMER!==null){clearInterval(LV_TIMER);LV_TIMER=null}
  LSetP(100);
  var pct=L("cc-lv-pct"); if(pct)pct.textContent="100%";
  setTimeout(LHide,260);
}
/* 统一收起：只隐藏不移除节点，便于解锁失败后手动重试时复用 */
function LHide(){
  var v=L("cc-loader"); if(!v)return;
  v.classList.add("hide");
  setTimeout(function(){if(v){v.style.display="none"}},400);
}
/* 阶段切换：解密 / 渲染阶段用不确定态条纹，避免假百分比 */
function LPhase(title,sub){
  LV_DONE=false;
  var v=L("cc-loader");
  if(v){v.style.display="";v.classList.remove("hide");v.classList.add("show")}
  if(LV_TIMER===null&&!LV_SHOWN){LV_SHOWN=true;LV_TIMER=setInterval(LTick,250)}
  var t=L("cc-lv-title"),bar=L("cc-lv-bar"),pct=L("cc-lv-pct"),s=L("cc-lv-sub");
  if(t)t.textContent=title;
  if(bar)bar.classList.add("indet");
  if(pct)pct.textContent="";
  if(s)s.innerHTML=sub||"";
  var m=L("cc-lv-meta"); if(m)m.style.display="none";
}
function LFinish(){
  LV_DONE=true;
  if(LV_TIMER!==null){clearInterval(LV_TIMER);LV_TIMER=null}
  LHide();
}
function LFail(title,msg){
  LV_FAIL=true; LV_DONE=true;
  if(LV_TIMER!==null){clearInterval(LV_TIMER);LV_TIMER=null}
  var v=L("cc-loader"); if(!v)return;
  v.classList.add("show"); v.classList.remove("hide");
  var t=L("cc-lv-title"),bar=L("cc-lv-bar"),m=L("cc-lv-meta"),s=L("cc-lv-sub"),w=L("cc-lv-wait");
  var e=L("cc-lv-err"),et=L("cc-lv-errt"),em=L("cc-lv-errm");
  if(t)t.style.display="none";
  if(bar)bar.style.display="none";
  if(m)m.style.display="none";
  if(s)s.style.display="none";
  if(w)w.style.display="none";
  if(e)e.style.display="flex";
  if(et)et.textContent=title||"加载失败";
  if(em)em.innerHTML=msg||"请检查网络后刷新重试";
  var r=L("cc-lv-retry");
  if(r)r.onclick=function(){location.reload()};
}
/* 进入页面即显示（150ms 延迟：缓存命中时 PAYLOAD 秒开，避免遮罩一闪而过） */
(function(){
  var sz=L("cc-lv-size"); if(sz&&LV_TOTAL>0)sz.textContent="· 共 "+LMB(LV_TOTAL);
  var s=L("cc-lv-sub"); if(s)s.textContent="正在安全下载加密数据";
  setTimeout(LShow,150);
})();
window.addEventListener("error",function(){
  if(!LV_DONE&&!LV_FAIL)LFail("页面加载出错","脚本执行异常，可能是网络中断导致文件不完整<br>请刷新重试");
});
/*LOADER_JS_END*/
</script>
<script>
/* ===== 逻辑脚本 =====
   ★ 2026-09-04 双 INCIDENT 修复：
   1) 渲染机制：document.open/write → iframe srcdoc（旧方案销毁 JS 全局环境、
      大文档脚本/样式时序紊乱，导致 2026-09-03 全部看板格式崩坏 ~15h）。
   2) 竞态：密码框先渲染、尾部 MB 级 PAYLOAD 脚本未解析完时点击按钮=监听器未挂上=
      完全没反应（风控 9.6MB 必现）。现在按钮初始禁用「页面加载中…」，
      由尾部 PAYLOAD 脚本执行后激活，从根上杜绝死窗。
   PAYLOAD 变量由页面尾部脚本定义，此处函数全部在调用时惰性引用它。 */
var SALT_LEN=16,IV_LEN=12,ITER=600000,LS_KEY="db_key_"+location.pathname;
function b64ToBytes(b64){var bin=atob(b64),out=new Uint8Array(bin.length),i;for(i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out}
function bytesToHex(b){var s=[],i;for(i=0;i<b.length;i++)s.push((b[i]<16?"0":"")+b[i].toString(16));return s.join("")}
function hexToBytes(h){var out=new Uint8Array(h.length/2),i;for(i=0;i<out.length;i++)out[i]=parseInt(h.substr(i*2,2),16);return out}
async function deriveRawKey(pwd,salt){
  var enc=new TextEncoder();
  var bk=await crypto.subtle.importKey("raw",enc.encode(pwd),"PBKDF2",false,["deriveBits"]);
  var bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:salt,iterations:ITER,hash:"SHA-256"},bk,256);
  return new Uint8Array(bits);
}
function showErr(m){var e=document.getElementById("err");if(e){e.textContent=m;e.style.display="block"}}
// iframe srcdoc 渲染：完全隔离的文档环境，无全局污染，大文档稳定
// （本地 Playwright 实测：点击解锁 → 看板完整渲染、8 个 canvas、版本徽章正确、零样式泄漏）。
// 注：Blob URL iframe 对大文件（≥2.4MB）在此环境导航失败（chrome-error），已弃用。
function showDashboard(bytes){
  var html=new TextDecoder().decode(bytes);
  // 注入 history 防护垫片：srcdoc 文档（about:srcdoc）中 history.replaceState/pushState
  // 会抛 SecurityError（看板内第三方库会调用），包 try/catch 静默降级。
  // 垫片必须放在所有看板脚本之前（紧随 <head> 注入）。
  var shim='<script>(function(){["replaceState","pushState"].forEach(function(m){try{var o=history[m].bind(history);history[m]=function(){try{return o.apply(history,arguments)}catch(e){}}}catch(e){}})})();</scr'+'ipt>';
  var injected=false;
  html=html.replace(/<head[^>]*>/i,function(m){injected=true;return m+shim});
  if(!injected){html=html.replace(/<html[^>]*>/i,function(m){injected=true;return m+shim});}
  if(!injected){html=shim+html;}
  // 清掉密码页 DOM 与样式影响（保留加载遮罩，供渲染阶段继续显示）
  var __lv=document.getElementById("cc-loader"); if(__lv&&__lv.parentNode)__lv.parentNode.removeChild(__lv);
  document.body.innerHTML="";
  document.body.removeAttribute("style");
  document.body.style.cssText="margin:0;padding:0;display:block;min-height:0;background:#fff";
  document.documentElement.style.cssText="margin:0;padding:0";
  // 移除加密壳自身的 <style>，杜绝 *{margin:0} 等规则泄漏进看板
  // 注意：跳过 #cc-lv-style，遮罩在渲染阶段仍需使用
  var st=document.head.querySelectorAll("style"),i;
  for(i=0;i<st.length;i++){if(st[i].id==="cc-lv-style")continue;st[i].parentNode.removeChild(st[i]);}
  var f=document.createElement("iframe");
  f.setAttribute("style","position:fixed;inset:0;width:100vw;height:100vh;border:0;display:block");
  document.body.appendChild(f);
  if(__lv)document.body.appendChild(__lv);   // 遮罩复位，渲染完成前继续遮住
  f.srcdoc=html;
  // 渲染完成判定：iframe load 优先，15s 硬兜底（大文档内部可能再异步渲染）
  var __fin=false;
  var __done=function(){if(__fin)return;__fin=true;try{LFinish()}catch(e){}};
  f.addEventListener("load",function(){setTimeout(__done,400)});
  setTimeout(__done,15000);
}
async function render(bytes){
  var salt=bytes.slice(0,SALT_LEN),iv=bytes.slice(SALT_LEN,SALT_LEN+IV_LEN),ct=bytes.slice(SALT_LEN+IV_LEN),rawKey;
  var saved=localStorage.getItem(LS_KEY);
  if(saved){try{rawKey=hexToBytes(JSON.parse(saved).k)}catch(e){rawKey=null}}
  if(!rawKey){
    var pwd=document.getElementById("pwd").value;
    if(!pwd){showErr("请输入访问口令");return false}
    try{LPhase("正在解密数据…","正在校验口令并解密内容，请稍候")}catch(e){}
    rawKey=await deriveRawKey(pwd,salt);
  }else{
    try{LPhase("正在解密数据…","已识别本机免密凭证，正在解密")}catch(e){}
  }
  var key=await crypto.subtle.importKey("raw",rawKey,"AES-GCM",false,["decrypt"]);
  var plain;
  try{plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,ct)}
  catch(e){
    if(saved){localStorage.removeItem(LS_KEY);return false}
    showErr("口令不对，请重新输入");
    return false;
  }
  if(!saved&&document.getElementById("rem").checked){
    localStorage.setItem(LS_KEY,JSON.stringify({k:bytesToHex(rawKey),t:Date.now()+30*864e5}));
  }
  try{LPhase("正在渲染看板…","数据已解密，正在载入页面")}catch(e){}
  await new Promise(function(r){setTimeout(r,30)});
  showDashboard(plain);
  return true;
}
async function unlock(){
  var btn=document.getElementById("btn");
  document.getElementById("err").style.display="none";
  btn.disabled=true;btn.textContent="解锁中…";
  try{
    var ok=await render(b64ToBytes(PAYLOAD));
    if(!ok){btn.disabled=false;btn.textContent="解锁看板";try{LFinish()}catch(e){}}
  }
  catch(e){
    showErr("解锁失败："+(e&&e.message?e.message:e));
    btn.disabled=false;btn.textContent="解锁看板";
    try{LFinish()}catch(err){}
  }
}
document.getElementById("btn").addEventListener("click",unlock);
document.getElementById("pwd").addEventListener("keydown",function(e){if(e.key==="Enter"&&!document.getElementById("btn").disabled)unlock()});
</script>
<script>
